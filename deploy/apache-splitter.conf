# Include INSIDE the existing middleware.ipaperdemo.io HTTPS VirtualHost.
# Requires Apache modules: proxy, proxy_http, headers, alias.
# Keep these rules before any catch-all ProxyPass for the existing middleware.

RedirectMatch 301 ^/splitter$ /splitter/
ProxyPass        /splitter/ http://127.0.0.1:8001/ connectiontimeout=5 timeout=120
ProxyPassReverse /splitter/ http://127.0.0.1:8001/

<Location "/splitter/">
    # Multipart overhead above the app's 50 MiB PDF limit.
    LimitRequestBody 54525952
    RequestHeader set X-Forwarded-Proto "https"
</Location>

# The checkout is inside the web root. Only the proxied app should be public;
# never serve source files, .git metadata or the virtual environment directly.
<Directory "/var/www/html/splitter">
    Require all denied
</Directory>
